<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloc 1 - Exemples HTML</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; color: #0f172a; }
    section { margin-bottom: 2rem; }
    .box { border: 1px solid #cbd5e1; padding: 1rem; border-radius: 8px; background: #f8fafc; }
    .inline-demo a { color: #0ea5e9; }
  </style>
</head>
<body>
  <h1>Bloc 1 - Exemples HTML</h1>

  <section id="jerarquia">
    <h2>Jerarquia de continguts</h2>
    <main class="box">
      <h1>Guia de productes</h1>
      <section>
        <h2>Portatils</h2>
        <article>
          <h3>Model A</h3>
          <p>Descripcio breu del producte.</p>
        </article>
      </section>
    </main>
  </section>

  <section id="bloc-inline">
    <h2>Elements de bloc i inline</h2>
    <p class="inline-demo">Aquest text conte un <strong>element inline</strong> i un <a href="#">enllac inline</a>.</p>
    <div class="box">Aquest div es un element de bloc: comenca en una nova linia i ocupa tota l'amplada disponible.</div>
  </section>
</body>
</html>
